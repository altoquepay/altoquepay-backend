name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  # The Deploy workflow runs it on each release tag before publishing anything.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: altoque_ci
          POSTGRES_PASSWORD: altoque_ci
          POSTGRES_DB: altoquepay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U altoque_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://altoque_ci:altoque_ci@localhost:5432/altoquepay_ci

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The oldest version the project supports, so newer syntax cannot slip in.
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # A fresh secret per run, so no secret has to live in the repository or its settings.
      - run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
