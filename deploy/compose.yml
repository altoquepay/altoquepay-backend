# One server: Caddy serves HTTPS and forwards to the API, which uses PostgreSQL.
# Run it from this folder, next to a .env made from .env.example: docker compose up -d --build
# On the server, deploy.sh runs it with the version the Deploy workflow sends.
name: altoquepay

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: altoquepay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: altoquepay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "altoquepay"]
      interval: 5s
      retries: 12

  api:
    # The server pulls the image the Deploy workflow published; locally, --build makes it.
    image: ghcr.io/altoquepay/altoquepay-backend:${API_VERSION:-local}
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://altoquepay:${POSTGRES_PASSWORD}@db:5432/altoquepay
      # Only Caddy may tell the API which IP the client has; not the whole network, whose
      # gateway is the source of requests Docker forwards from the host itself.
      FORWARDED_ALLOW_IPS: 172.28.0.10
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      default:
        ipv4_address: 172.28.0.10
    depends_on:
      - api

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  caddy_data:
